[tool.poetry]
name = "aws-whatsapp-agentcore-backend"
version = "1.0.0"
description = "WhatsApp Generative-AI chatbot on AWS with Bedrock AgentCore Runtime, Strands Agents and optional Cognito Auth Portal"
authors = ["Santiago Garcia Arango <san99tiago@gmail.com>"]
license = "Apache"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
aws-cdk-lib = "^2.263.0"
constructs = ">=10.0.0,<11.0.0"

[tool.poetry.group.dev.dependencies]
poethepoet = "^0.37.0"
pytest = "^8.4.0"
pytest-mock = "^3.15.0"
coverage = "^7.10.0"
black = "^25.1.0"
boto3 = "^1.40.0"
aws-lambda-powertools = "^3.31.0"
fastapi = "^0.141.0"
httpx = "^0.28.0"
mangum = "^0.21.0"
pydantic = "^2.12.0"
moto = {version = "^5.1.0", extras = ["cognitoidp"]}
requests = "^2.32.0"
strands-agents = "^1.50.0"
bedrock-agentcore = "^1.20.0"

[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["infrastructure/cdk", "backend", "agent"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poe.tasks]
black-format = "black ."
black-check = "black . --check --diff -v"
test-unit = ["_test_unit", "_coverage_report", "_coverage_html"]
synth = { cmd = "cdk synth", cwd = "infrastructure" }
diff = { cmd = "cdk diff", cwd = "infrastructure" }
deploy = { cmd = "cdk deploy --all --require-approval never", cwd = "infrastructure" }
destroy = { cmd = "cdk destroy --all --force", cwd = "infrastructure" }
_test_unit = "coverage run -m pytest tests/unit"
_coverage_report = "coverage report"
_coverage_html = "coverage html"

[tool.coverage.run]
branch = true
source = ["backend", "infrastructure", "agent"]
omit = ["**/__init__.py", "infrastructure/cdk/app.py", "agent/dist/*"]

[tool.coverage.report]
show_missing = false
